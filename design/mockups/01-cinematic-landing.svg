  <radialGradient id="halo"><stop stop-color="#2D8DAB" stop-opacity=".27"/><stop offset="1" stop-color="#2D8DAB" stop-opacity="0"/></radialGradient>
  <linearGradient id="layer" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#18344F"/><stop offset="1" stop-color="#0D1B2B"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#66D9E8"/><stop offset="1" stop-color="#5C86FF"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
