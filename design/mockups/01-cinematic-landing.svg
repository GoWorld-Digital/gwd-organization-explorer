<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">GWD AI-Native Organization Explorer — cinematic landing wireframe</title>
<desc id="desc">Dark institutional landing artboard with product statement, navigation and a five-layer spatial organization architecture with a surrounding capability field.</desc>
<defs>
