name: Explorer checks
on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'content/**'
      - 'tests/**'
      - '*.json'
      - '*.mjs'
      - '.github/workflows/explorer.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - name: Exercise the production server
        run: |
          npm start -- --hostname 127.0.0.1 > /tmp/explorer.log 2>&1 &
          curl -fsS --retry 20 --retry-all-errors --retry-delay 1 http://127.0.0.1:3000/ -o /dev/null
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: explorer-screenshots
          path: docs/screenshots/
